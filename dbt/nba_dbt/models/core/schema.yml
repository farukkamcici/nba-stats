version: 2

models:
  - name: fact_game
    description: "One row per NBA game with game-level status and home/away scoreboard fields."
    columns:
      - name: game_date
        description: "Logical game date from raw source partition."
        data_tests:
          - not_null
      - name: game_id
        description: "NBA game identifier."
        data_tests:
          - not_null
          - unique
      - name: home_team_id
        description: "Home team identifier."
        data_tests:
          - not_null
      - name: away_team_id
        description: "Away team identifier."
        data_tests:
          - not_null

  - name: fact_team_game
    description: "One row per team per game with team-level boxscore statistics."
    columns:
      - name: game_id
        description: "NBA game identifier."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_game')
                field: game_id
      - name: team_id
        description: "NBA team identifier."
        data_tests:
          - not_null
      - name: pts
        description: "Team points in the game."
        data_tests:
          - not_null
      - name: reb
        description: "Team total rebounds in the game."
        data_tests:
          - not_null
      - name: ast
        description: "Team assists in the game."
        data_tests:
          - not_null
    data_tests:
      - unique:
          arguments:
            column_name: "concat(game_id, '-', team_id)"

  - name: fact_player_game
    description: "One row per player per game with player-level boxscore statistics."
    columns:
      - name: game_id
        description: "NBA game identifier."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_game')
                field: game_id
      - name: player_id
        description: "NBA player identifier."
        data_tests:
          - not_null
      - name: team_id
        description: "NBA team identifier for the player row."
        data_tests:
          - not_null
      - name: pts
        description: "Player points in the game."
        data_tests:
          - not_null
    data_tests:
      - unique:
          arguments:
            column_name: "concat(game_id, '-', player_id)"
